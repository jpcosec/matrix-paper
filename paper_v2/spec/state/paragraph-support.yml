id: state.paper-v2-paragraph-support
title: paper_v2 - Paragraph Support Status
type: state
version: "0.1"
data:
  entity: Paragraph
  initial: incomplete
  workloop_guards:
    - has_readable_note_body
    - has_readable_source_excerpt
    - has_next_editorial_action
    - has_edit_target
  states:
    - id: missing_note
      label: Missing Note
    - id: missing_source
      label: Missing Source
    - id: evidence_pending
      label: Evidence Pending
    - id: supported
      label: Supported
    - id: incomplete
      label: Incomplete
  transitions:
    - from: incomplete
      to: missing_note
      "on": compose
      guard: no linked note
    - from: incomplete
      to: missing_source
      "on": compose
      guard: note exists, no source refs
    - from: incomplete
      to: evidence_pending
      "on": compose
      guard: sources linked, excerpt or anchor missing
    - from: incomplete
      to: supported
      "on": compose
      guard: note + sources complete
    - from: missing_note
      to: supported
      "on": link note
    - from: missing_source
      to: supported
      "on": link sources
    - from: evidence_pending
      to: supported
      "on": fill excerpt and anchor
      guard: note/source content remains readable and actionable in the UI
    - from: supported
      to: incomplete
      "on": remove note or source
  acceptance_notes:
    - support status alone is insufficient when note/source content is unreadable in the UI
    - a paragraph is not operationally supported unless the user can identify the next editorial action and edit target
