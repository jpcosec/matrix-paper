id: state.paper-v2-paragraph-support
title: paper_v2 - Paragraph Support Status
type: state
version: "0.1"
data:
  entity: Paragraph
  initial: incomplete
  states:
    - id: missing_note
      label: Missing Note
    - id: missing_source
      label: Missing Source
    - id: evidence_pending
      label: Evidence Pending
    - id: supported
      label: Supported
    - id: incomplete
      label: Incomplete
  transitions:
    - from: incomplete
      to: missing_note
      "on": compose
      guard: no linked note
    - from: incomplete
      to: missing_source
      "on": compose
      guard: note exists, no source refs
    - from: incomplete
      to: evidence_pending
      "on": compose
      guard: sources linked, excerpt or anchor missing
    - from: incomplete
      to: supported
      "on": compose
      guard: note + sources complete
    - from: missing_note
      to: supported
      "on": link note
    - from: missing_source
      to: supported
      "on": link sources
    - from: evidence_pending
      to: supported
      "on": fill excerpt and anchor
    - from: supported
      to: incomplete
      "on": remove note or source
