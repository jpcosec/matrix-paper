id: matrix.paper-v2-ui-components
title: paper_v2 - UI / Component Matrix
type: component_view_matrix
version: "0.1"
data:
  views:
    - id: document
      label: Documento renderizado (izquierda)
      stages:
        - id: browse-sections
          label: navegar secciones
        - id: read-paragraphs
          label: leer parrafos
        - id: select-paragraph
          label: seleccionar parrafo
        - id: view-status
          label: ver estado soporte

    - id: inspector
      label: Inspector SLDB (derecha)
      stages:
        - id: section-context
          label: contexto seccion
        - id: paragraph-detail
          label: detalle parrafo
        - id: note-support
          label: soporte notas
        - id: source-evidence
          label: evidencia fuentes
        - id: identify-next-action
          label: decidir siguiente accion
        - id: reveal-edit-target
          label: revelar punto de edicion

    - id: workflow
      label: Flujo editorial
      stages:
        - id: edit-artifact
          label: editar artefacto
        - id: rebuild
          label: rebuild
        - id: verify-change
          label: verificar cambio

    - id: api
      label: API /api/graph.json
      stages:
        - id: compose
          label: componer payload
        - id: derive-status
          label: derivar estados
        - id: serve
          label: servir UI

  components:
    - name: AstroApp
      kind: core
      stages:
        document: [browse-sections, read-paragraphs, select-paragraph, view-status]
        inspector: [section-context, paragraph-detail, note-support, source-evidence, identify-next-action, reveal-edit-target]
        workflow: [edit-artifact, rebuild, verify-change]
        api: [serve]
      children:
        - name: DocumentPane
          kind: boundary
          stages:
            document: [browse-sections, read-paragraphs, select-paragraph, view-status]
          children:
            - name: RenderedManuscript
              kind: ui
              stages:
                document: [browse-sections, read-paragraphs, select-paragraph]
            - name: StatusBadges
              kind: ui
              stages:
                document: [view-status]

        - name: SldbInspector
          kind: boundary
          stages:
            inspector: [section-context, paragraph-detail, note-support, source-evidence, identify-next-action, reveal-edit-target]
          children:
            - name: SectionsPane
              kind: ui
              stages:
                inspector: [section-context]
            - name: ParagraphInspector
              kind: ui
              stages:
                inspector: [paragraph-detail, identify-next-action, reveal-edit-target]
                workflow: [edit-artifact, rebuild, verify-change]
            - name: NotesPane
              kind: ui
              stages:
                inspector: [note-support, identify-next-action, reveal-edit-target]
                workflow: [edit-artifact, rebuild, verify-change]
            - name: SourcesPane
              kind: ui
              stages:
                inspector: [source-evidence, identify-next-action, reveal-edit-target]
                workflow: [edit-artifact, rebuild, verify-change]

        - name: GraphApi
          kind: service
          stages:
            api: [compose, derive-status, serve]
          children:
            - name: StatusDerivation
              kind: core
              stages:
                api: [derive-status]
            - name: SldbLoaders
              kind: core
              stages:
                api: [compose]

    - name: BuildPipeline
      kind: core
      stages:
        workflow: [rebuild, verify-change]
        api: [compose]

    - name: DeskopsWorkflow
      kind: boundary
      stages:
        workflow: [edit-artifact, rebuild, verify-change]
        api: [serve]
