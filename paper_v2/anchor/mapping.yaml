sections:
  01_introduction:
  - composition: comp_antecedentes
    path: composiciones_review/comp_antecedentes.md
    atom_count: 5
    question: ¿Por qué los primitivos discretos son fundamentalmente necesarios?
    justificacion: 'El intro plantea la necesidad de primitivos discretos: la pregunta
      central de esta composicion.'
  - composition: comp_isomorfismo
    path: composiciones_review/comp_isomorfismo.md
    atom_count: 6
    question: ¿Cómo demuestra el isomorfismo Tractatus–Álgebra que la discreción es
      una exigencia filosófica, no solo computacional?
    justificacion: La tesis del intro (la discrecion es exigencia, no opcion) es exactamente
      la pregunta del isomorfismo Tractatus-Algebra.
  01_1_sota:
  - composition: comp_eje_d
    path: composiciones_review/comp_eje_d.md
    atom_count: 6
    question: ¿En qué se diferencia Matrix de RAG, KGs/OWL, y neuro-simbólicos previos?
    justificacion: 'El SotA diferencia el marco de RAG, KGs/OWL y neuro-simbolicos
      previos: contenido literal del Eje D.'
  - composition: comp_fuentes
    path: composiciones_review/comp_fuentes.md
    atom_count: 34
    question: ¿Qué evidencia científica publicada fundamenta las pruebas de necesidad
      discreta y límites del espacio continuo?
    justificacion: Las citas del SotA (hallucination detection, model collapse, HK+/-)
      son los Source_PDF de esta composicion.
  - composition: comp_antecedentes
    path: composiciones_review/comp_antecedentes.md
    atom_count: 5
    question: ¿Por qué los primitivos discretos son fundamentalmente necesarios?
    justificacion: El estado del arte sobre alucinaciones y limites del continuo corresponde
      a la carpeta Antecedentes.
  02_philosophical_foundation:
  - composition: comp_filosofia
    path: composiciones_review/comp_filosofia.md
    atom_count: 5
    question: ¿Por qué la lógica contiene discontinuidades ontológicas que ningún
      espacio continuo puede aproximar?
    justificacion: 'Fundamentacion filosofica: discontinuidades ontologicas que ningun
      espacio continuo aproxima.'
  - composition: comp_isomorfismo
    path: composiciones_review/comp_isomorfismo.md
    atom_count: 6
    question: ¿Cómo demuestra el isomorfismo Tractatus–Álgebra que la discreción es
      una exigencia filosófica, no solo computacional?
    justificacion: El isomorfismo Tractatus-Algebra es la base formal de la seccion
      filosofica.
  03_proposed_representation:
  - composition: comp_computacion
    path: composiciones_review/comp_computacion.md
    atom_count: 5
    question: ¿Qué impide que una distancia vectorial continua aproxime lógica formal?
    justificacion: La representacion propuesta (kernel Booleano, Si binaria) es la
      cadena de la carpeta Computacion.
  - composition: comp_matematica
    path: composiciones_review/comp_matematica.md
    atom_count: 5
    question: ¿Qué pruebas matemáticas formales demuestran que la aproximación continua
      de funciones indicadoras lógicas es estructuralmente imposible?
    justificacion: Las pruebas de imposibilidad continua justifican matematicamente
      la representacion discreta propuesta.
  - composition: comp_eje_b
    path: composiciones_review/comp_eje_b.md
    atom_count: 11
    question: ¿Cómo se crean S_i y V_i a escala real, y cómo se distingue ausencia
      de inaplicabilidad?
    justificacion: 'Eje B responde como se crean S_i y V_i a escala: nucleo operativo
      de la representacion propuesta.'
  04_discussion:
  - composition: comp_eje_a
    path: composiciones_review/comp_eje_a.md
    atom_count: 11
    question: ¿Por qué los primitivos discretos son necesarios, qué impide la distancia
      vectorial, y dónde está la demostración rigurosa?
    justificacion: 'La discusion recorre necesidad, limite del continuo y demostracion:
      las tres sub-preguntas del Eje A.'
  - composition: comp_gaps
    path: composiciones_review/comp_gaps.md
