  - composition: comp_antecedentes
    path: composiciones_review/comp_antecedentes.md
    atom_count: 5
    question: ¿Por qué los primitivos discretos son fundamentalmente necesarios?
    justificacion: El estado del arte sobre alucinaciones y limites del continuo corresponde a la carpeta Antecedentes.
  02_philosophical_foundation:
  - composition: comp_filosofia
    path: composiciones_review/comp_filosofia.md
    atom_count: 5
    question: ¿Por qué la lógica contiene discontinuidades ontológicas que ningún espacio continuo puede aproximar?
    justificacion: 'Fundamentacion filosofica: discontinuidades ontologicas que ningun espacio continuo aproxima.'
  - composition: comp_isomorfismo
    path: composiciones_review/comp_isomorfismo.md
    atom_count: 6
    question: ¿Cómo demuestra el isomorfismo Tractatus–Álgebra que la discreción es una exigencia filosófica, no solo computacional?
    justificacion: El isomorfismo Tractatus-Algebra es la base formal de la seccion filosofica.
  03_proposed_representation:
  - composition: comp_computacion
    path: composiciones_review/comp_computacion.md
    atom_count: 5
    question: ¿Qué impide que una distancia vectorial continua aproxime lógica formal?
    justificacion: La representacion propuesta (kernel Booleano, Si binaria) es la cadena de la carpeta Computacion.
  - composition: comp_matematica
    path: composiciones_review/comp_matematica.md
    atom_count: 5
    question: ¿Qué pruebas matemáticas formales demuestran que la aproximación continua de funciones indicadoras lógicas es estructuralmente imposible?
    justificacion: Las pruebas de imposibilidad continua justifican matematicamente la representacion discreta propuesta.
