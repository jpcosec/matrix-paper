    question: ¿Cómo demuestra el isomorfismo Tractatus–Álgebra que la discreción es una exigencia filosófica, no solo computacional?
    justificacion: La tesis del intro (la discrecion es exigencia, no opcion) es exactamente la pregunta del isomorfismo Tractatus-Algebra.
